name: Deploy to cloud functions

on:
  push:
    branches: "test-gha"

env:
  PROJECT_PREFIX: projects/${{ secrets.GCP_PROJECT_ID }}/secrets

jobs:
  deploy-to-cloud-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - uses: google-github-actions/deploy-cloud-functions@v3
        timeout-minutes: 10
        with:
          name: interiorize-function
          runtime: nodejs20
          source_dir: src
          entry_point: api
          secrets: |-
            DB_HOST=interiorize-db-host:latest
            DB_NAME=interiorize-db-name:latest
            DB_USER=interiorize-db-user:latest
            JWKSURI=interiorize-auth0-jwks-uri:latest
            ISSUER=interiorize-auth0-issuer:latest
