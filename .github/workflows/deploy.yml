name: Deploy to cloud functions

on:
  push:
    branches: "test-gha"

jobs:
  deploy-to-cloud-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}
          # project_id: titanium-spider-428214-u0
          # workload_identity_provider: projects/419282086064/locations/global/workloadIdentityPools/github/providers/interiorize-backend

      - id: deploy
        uses: google-github-actions/deploy-cloud-functions@v3
        timeout-minutes: 10
        with:
          name: interiorize-function
          runtime: nodejs20
          source_dir: src
          entry_point: api
